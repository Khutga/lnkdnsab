<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Analyzer — İlan Analiz & CV Optimize</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(145deg,#0a0a0f,#0d1117 40%,#0a0f1a);color:#c9d1d9;font-family:'JetBrains Mono','Fira Code',monospace}
.header{border-bottom:1px solid #1e293b;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;font-family:'Space Grotesk'}
.header-title{font-family:'Space Grotesk';font-weight:600;font-size:16px;color:#e2e8f0}
.steps{display:flex;gap:6px}
.step-badge{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid transparent;color:#475569;transition:.3s}
.step-badge.active{background:rgba(99,102,241,.15);color:#818cf8;border-color:rgba(99,102,241,.25)}
.container{max-width:920px;margin:0 auto;padding:32px 20px}
h2{font-family:'Space Grotesk';font-size:24px;font-weight:700;color:#e2e8f0;margin-bottom:6px}
.sub{color:#64748b;font-size:13px;margin-bottom:20px}
input[type=text],textarea{width:100%;background:#0d1117;border:1px solid #1e293b;border-radius:10px;padding:14px 16px;color:#c9d1d9;font-size:13px;font-family:'JetBrains Mono';line-height:1.6;resize:vertical;outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:#6366f1}
::placeholder{color:#334155}
.btn{padding:12px 28px;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:'Space Grotesk';cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn-primary:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
.btn-green{background:#10b981;color:#fff}
.btn-green:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
.btn-ghost{background:transparent;color:#64748b;border:1px solid #1e293b}
.btn-outline{background:transparent;color:#818cf8;border:1px solid rgba(99,102,241,.3);width:100%}
.btn-row{display:flex;justify-content:space-between;margin-top:16px}
.card{background:rgba(15,15,25,.6);border:1px solid #1e293b;border-radius:14px;padding:20px;margin-bottom:12px;transition:.2s}
.card:hover{border-color:rgba(99,102,241,.3)}
.card.open{border-color:rgba(99,102,241,.4)}
.api-box{background:rgba(99,102,241,.04);border:1px solid rgba(99,102,241,.12);border-radius:12px;padding:16px;margin-bottom:20px}
.api-box label{font-size:12px;color:#818cf8;font-family:'Space Grotesk';font-weight:600}
.api-box .hint{font-size:11px;color:#475569;margin-top:6px}
.api-box .hint a{color:#818cf8}
.upload-zone{border:2px dashed #1e293b;border-radius:12px;padding:36px 24px;text-align:center;cursor:pointer;transition:.2s}
.upload-zone:hover{border-color:#6366f1}
.upload-zone.ok{background:rgba(99,102,241,.04);border-color:rgba(99,102,241,.3)}
.badge{display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:500;margin:0 4px 4px 0;border:1px solid}
.badge-g{background:rgba(16,185,129,.12);color:#6ee7b7;border-color:rgba(16,185,129,.25)}
.badge-r{background:rgba(239,68,68,.08);color:#fca5a5;border-color:rgba(239,68,68,.2)}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.skill-box{border-radius:8px;padding:12px}
.skill-box.g{background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.12)}
.skill-box.r{background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.12)}
.skill-box h4{font-family:'Space Grotesk';font-size:12px;margin-bottom:8px}
.item{padding:10px 12px;background:rgba(0,0,0,.25);border-radius:6px;margin-bottom:4px;font-size:11px;line-height:1.6}
.item-p{border-left:3px solid #6366f1}
.item-y{border-left:3px solid #f59e0b}
.progress-bar{width:100%;height:6px;background:#1e293b;border-radius:3px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:3px;transition:width .3s}
.divider{margin:14px 0;text-align:center;color:#334155;font-size:11px}
.hidden{display:none!important}
.fade{animation:fadeIn .4s ease}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#0d1117;border-radius:20px 20px 0 0;width:100%;max-width:920px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}
.cv-output{background:#0a0a0f;border:1px solid #1e293b;border-radius:10px;padding:16px;font-size:13px;line-height:1.7;color:#c9d1d9;white-space:pre-wrap;user-select:all;max-height:60vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){.skills-grid{grid-template-columns:1fr}.steps{display:none}}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">CV</div>
    <span class="header-title">CV Analyzer</span>
  </div>
  <div class="steps">
    <div class="step-badge active" id="sb0">1. Ara</div>
    <div class="step-badge" id="sb1">2. CV</div>
    <div class="step-badge" id="sb2">3. Sonuçlar</div>
  </div>
</div>

<div class="container">
  <div class="api-box">
    <label>Groq API Key</label>
    <input type="text" id="apiKey" placeholder="gsk_..." style="margin-top:8px">
    <div class="hint">Ücretsiz: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></div>
  </div>

  <!-- STEP 0 -->
  <div id="step0" class="fade">
    <h2>İş Ara</h2>
    <p class="sub">LinkedIn'de iş ilanı arayın</p>
    <input type="text" id="query" placeholder="software engineer, flutter developer...">
    <div style="height:8px"></div>
    <input type="text" id="location" placeholder="istanbul, turkey, remote..." value="istanbul">
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
      <span style="color:#64748b;font-size:12px">Maks:</span>
      <input type="range" id="maxResults" min="5" max="25" step="5" value="10" style="flex:1">
      <span id="maxLabel" style="color:#818cf8;font-weight:600;font-size:13px">10</span>
    </div>
    <button class="btn btn-primary" id="btnSearch" style="width:100%" disabled>🔍 Ara</button>
  </div>

  <!-- STEP 1 -->
  <div id="step1" class="hidden">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="btn btn-ghost" id="btnBack0" style="padding:8px 14px">←</button>
      <div><h2 style="margin:0">CV Bilgisi</h2><p id="jobSummary" style="color:#64748b;font-size:12px;margin-top:2px"></p></div>
    </div>
    <input type="file" id="cvFile" accept=".pdf,.txt,.md" style="display:none">
    <div class="upload-zone" id="cvUpload">
      <div style="font-size:32px;margin-bottom:8px" id="cvIcon">📄</div>
      <div style="color:#818cf8;font-weight:600;font-size:14px;font-family:'Space Grotesk'" id="cvLabel">CV Dosyası Yükle</div>
      <div style="color:#475569;font-size:11px;margin-top:4px">PDF, TXT, MD</div>
    </div>
    <div class="divider">— veya yapıştırın —</div>
    <textarea id="cvText" rows="10" placeholder="CV içeriğinizi buraya yapıştırın..."></textarea>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnBack0b">← Geri</button>
      <button class="btn btn-primary" id="btnAnalyze" disabled>✨ Analiz Et</button>
    </div>
  </div>

  <!-- PROGRESS -->
  <div id="progress" class="hidden" style="text-align:center;padding:50px 0">
    <p style="color:#818cf8;font-family:'Space Grotesk';font-size:16px;font-weight:600" id="progTitle">Analiz başlıyor...</p>
    <p style="color:#475569;font-size:12px;margin-top:4px" id="progSub"></p>
    <div class="progress-bar"><div class="progress-fill" id="progBar" style="width:0%"></div></div>
    <p style="color:#334155;font-size:11px" id="progCount"></p>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden"></div>
</div>

<!-- CV Modal -->
<div id="cvModal" class="modal-bg hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal">
    <div class="modal-header">
      <div><h2 style="font-size:18px">✨ Optimize Edilmiş CV</h2><p id="modalSub" style="color:#818cf8;font-size:12px;margin-top:4px"></p></div>
      <button class="btn btn-ghost" onclick="document.getElementById('cvModal').classList.add('hidden')" style="padding:8px 12px">✕</button>
    </div>
    <div class="cv-output" id="cvOutput"></div>
    <button class="btn btn-green" id="btnCopyCv" style="width:100%;margin-top:12px">📋 CV'yi Kopyala</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let jobs=[], cvText='', apiKey='';

apiKey=localStorage.getItem('groq_key')||'';
$('apiKey').value=apiKey;
$('apiKey').oninput=()=>{apiKey=$('apiKey').value.trim();localStorage.setItem('groq_key',apiKey)};
const savedCv=localStorage.getItem('cv_text')||'';
if(savedCv)$('cvText').value=savedCv;
$('maxResults').oninput=()=>$('maxLabel').textContent=$('maxResults').value;
$('query').oninput=()=>$('btnSearch').disabled=!$('query').value.trim();
$('cvText').oninput=()=>$('btnAnalyze').disabled=!$('cvText').value.trim();

function setStep(n){
  ['step0','step1','step2','progress'].forEach(id=>$(id).classList.add('hidden'));
  if(n>=0){$(`step${n}`).classList.remove('hidden');$(`step${n}`).classList.add('fade');}
  for(let i=0;i<3;i++)$(`sb${i}`).classList.toggle('active',i===n);
  $('apiKey').parentElement.style.display=n===2?'none':'';
}
$('btnBack0').onclick=$('btnBack0b').onclick=()=>setStep(0);

// ===== SEARCH (via backend) =====
$('btnSearch').onclick=async()=>{
  const q=$('query').value.trim();
  if(!q)return;
  $('btnSearch').disabled=true;$('btnSearch').innerHTML='⏳ Aranıyor...';
  try{
    const resp=await fetch('api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,location:$('location').value.trim(),max_results:parseInt($('maxResults').value)})});
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    jobs=data.jobs||[];
    if(!jobs.length){alert('İlan bulunamadı.');return}
    $('jobSummary').textContent=`${jobs.length} ilan · "${q}" · ${$('location').value}`;
    setStep(1);
  }catch(e){alert('Hata: '+e.message)}
  finally{$('btnSearch').disabled=false;$('btnSearch').innerHTML='🔍 Ara'}
};

// ===== CV FILE =====
$('cvUpload').onclick=()=>$('cvFile').click();
$('cvFile').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  $('cvIcon').textContent='📄';$('cvLabel').textContent=file.name+' (okunuyor...)';$('cvUpload').classList.add('ok');
  if(file.name.toLowerCase().endsWith('.pdf')){
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const ab=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:ab}).promise;let txt='';
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();txt+=c.items.map(x=>x.str).join(' ')+'\n'}
      $('cvText').value=txt.trim();$('cvLabel').textContent=file.name+' ✓';
    }catch{$('cvLabel').textContent=file.name+' (hata!)';}
  }else{$('cvText').value=await file.text();$('cvLabel').textContent=file.name+' ✓'}
  $('btnAnalyze').disabled=!$('cvText').value.trim();
};

// ===== GROQ via backend =====
async function callGroq(prompt,jsonMode=true){
  if(!apiKey)throw new Error('API key gerekli');
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),60000);
  try{
    const resp=await fetch('api/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:apiKey,prompt:prompt,json_mode:jsonMode}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await resp.json();
    if(data.error)throw new Error(typeof data.error==='object'?data.error.message:data.error);
    return data.choices?.[0]?.message?.content||'';
  }catch(e){
    clearTimeout(timeout);
    if(e.name==='AbortError')throw new Error('Zaman aşımı — tekrar deneyin');
    throw e;
  }
}

// Groq'u direkt tarayıcıdan çağır (CV düzenleme için — backend timeout'u aşmak için)
async function callGroqDirect(prompt){
  if(!apiKey)throw new Error('API key gerekli');
  const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],temperature:0.4,max_tokens:2000})
  });
  if(resp.status===429){await new Promise(r=>setTimeout(r,8000));return callGroqDirect(prompt);}
  if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||'HTTP '+resp.status);}
  const data=await resp.json();
  return data.choices?.[0]?.message?.content||'';
}

// ===== ANALYZE =====
$('btnAnalyze').onclick=async()=>{
  cvText=$('cvText').value.trim();
  if(!cvText||!apiKey){alert('API key ve CV gerekli');return}
  localStorage.setItem('cv_text',cvText);
  setStep(-1);$('progress').classList.remove('hidden');
  const results=[];
  for(let i=0;i<jobs.length;i++){
    const job=jobs[i];
    $('progTitle').textContent=job.title;
    $('progSub').textContent=job.company+' · '+(i+1)+'/'+jobs.length;
    $('progBar').style.width=((i+1)/jobs.length*100)+'%';
    $('progCount').textContent=Math.round((i+1)/jobs.length*100)+'%';

    // Detay çek
    if(!job.description&&job.url){
      $('progSub').textContent+=' · detay çekiliyor...';
      try{
        const r=await fetch('api/scrape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:job.url})});
        const d=await r.json();
        job.description=d.description||'';
      }catch{}
    }
    if(!job.description){results.push({_title:job.title,_company:job.company,_location:job.location,_url:job.url,match_percentage:0,matching_skills:[],missing_skills:[],suggestions:[],cv_additions:[],summary:'İlan detayı alınamadı'});continue}

    $('progSub').textContent=job.company+' · AI analiz...';
    const prompt=`Sen bir CV analiz uzmanısın. İş ilanından SADECE teknik ve soft SKILL isimlerini çıkar, CV ile karşılaştır.

KRİTİK KURALLAR:
- Skill'ler KISA olmalı: 1-3 kelime. Örnek: "Python", "SQL", "React", "CI/CD", "Agile", "REST API", "Docker", "Team Leadership"
- ASLA cümle yazma. "Familiarity with Python for..." YANLIŞ. Doğrusu: "Python"
- ASLA iş tanımı/görev cümlesi yazma. Sadece skill/teknoloji/yetkinlik adı.
- Bir skill ASLA hem matching hem missing'de olamaz.
- CV'de olan = matching, CV'de olmayan = missing.
- Eş anlamlıları tanı: "Git/GitHub" = "Version Control", "Flutter" = "Cross-Platform Development"
- match_percentage: matching sayısı / (matching + missing) * 100

İŞ İLANI:
${job.title} @ ${job.company}
${job.description.slice(0,2500)}

CV:
${cvText.slice(0,2500)}

SADECE JSON:
{"position":"${job.title}","company":"${job.company}","matching_skills":["Python","Flutter"],"missing_skills":["Docker","AWS"],"match_percentage":0,"suggestions":["öneri türkçe"],"cv_additions":["ekle türkçe"],"summary":"2 cümle türkçe"}`;

    try{
      const raw=await callGroq(prompt);
      const r=JSON.parse(raw.replace(/```json|```/g,'').trim());
      r._title=job.title;r._company=job.company;r._location=job.location;r._url=job.url;r._desc=job.description;
      results.push(r);
    }catch(e){results.push({_title:job.title,_company:job.company,_location:job.location,_url:job.url,_desc:job.description,match_percentage:0,matching_skills:[],missing_skills:[],suggestions:[],cv_additions:[],summary:'Hata: '+e.message})}
    if(i<jobs.length-1)await new Promise(r=>setTimeout(r,2500));
  }
  results.sort((a,b)=>(b.match_percentage||0)-(a.match_percentage||0));
  renderResults(results);setStep(2);
};

// ===== RENDER =====
function gauge(pct,sz=56){
  const c=pct>70?'#10b981':pct>40?'#f59e0b':'#ef4444';
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${sz/2-6}" fill="none" stroke="#1e293b" stroke-width="4"/><circle cx="${sz/2}" cy="${sz/2}" r="${sz/2-6}" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="${pct*(sz-12)*Math.PI/100} ${(sz-12)*Math.PI}" stroke-linecap="round" transform="rotate(-90 ${sz/2} ${sz/2})"/><text x="${sz/2}" y="${sz/2+5}" text-anchor="middle" fill="${c}" font-size="${sz*.28}" font-weight="700" font-family="Space Grotesk">${pct}</text></svg>`;
}

function renderResults(results){
  const avg=results.length?Math.round(results.reduce((s,r)=>s+(r.match_percentage||0),0)/results.length):0;
  const miss={};results.forEach(r=>(r.missing_skills||[]).forEach(s=>{const k=s.toLowerCase();miss[k]=(miss[k]||0)+1}));
  const topMiss=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,12);

  let h=`<div style="background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.03));border:1px solid rgba(99,102,241,.18);border-radius:16px;padding:24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-family:Space Grotesk;font-size:20px;font-weight:700;color:#e2e8f0">Toplu Analiz</div><div style="color:#818cf8;font-size:12px;margin-top:4px">${results.length} ilan · Ort. %${avg} uyum</div></div>${gauge(avg,58)}</div>`;

  if(topMiss.length)h+=`<div style="background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.1);border-radius:12px;padding:16px;margin-bottom:16px"><div style="color:#ef4444;font-size:13px;font-weight:600;font-family:Space Grotesk;margin-bottom:8px">🔑 En Çok İstenen Eksik Beceriler</div><div>${topMiss.map(([s,c])=>`<span class="badge badge-r">${s} (${c}x)</span>`).join('')}</div></div>`;

  h+=`<div style="font-family:Space Grotesk;font-size:15px;font-weight:600;color:#e2e8f0;margin-bottom:10px">İlanlar (uyuma göre)</div>`;

  results.forEach((r,i)=>{
    const pct=r.match_percentage||0;
    h+=`<div class="card" id="card${i}" onclick="toggleCard(${i})"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-family:Space Grotesk;font-size:14px;font-weight:600;color:#e2e8f0">${r._title||r.position}</div><div style="color:#818cf8;font-size:11px;margin-top:2px">${r._company||r.company}${r._location?' · '+r._location:''}</div></div>${gauge(pct,44)}</div><div class="hidden" id="detail${i}"><hr style="border:none;border-top:1px solid #1e293b;margin:14px 0"><p style="color:#94a3b8;font-size:12px;line-height:1.5;margin-bottom:10px">${r.summary||''}</p><div class="skills-grid"><div class="skill-box g"><h4 style="color:#10b981">✓ Eşleşen (${(r.matching_skills||[]).length})</h4><div>${(r.matching_skills||[]).map(s=>`<span class="badge badge-g">${s}</span>`).join('')}</div></div><div class="skill-box r"><h4 style="color:#ef4444">✗ Eksik (${(r.missing_skills||[]).length})</h4><div>${(r.missing_skills||[]).map(s=>`<span class="badge badge-r">${s}</span>`).join('')}</div></div></div>${(r.cv_additions||[]).length?`<div style="margin-top:10px"><strong style="color:#818cf8;font-size:11px">📝 CV'ye ekle:</strong>${r.cv_additions.map(s=>`<div class="item item-p">${s}</div>`).join('')}</div>`:''}${(r.suggestions||[]).length?`<div style="margin-top:10px"><strong style="color:#f59e0b;font-size:11px">💡 Öneriler:</strong>${r.suggestions.map((s,j)=>`<div class="item item-y">${j+1}. ${s}</div>`).join('')}</div>`:''}${r._url?`<a href="${r._url}" target="_blank" class="btn btn-outline" style="margin-top:10px;text-decoration:none;justify-content:center">🔗 LinkedIn'de Aç</a>`:''}<button class="btn btn-green" style="width:100%;margin-top:8px" onclick="event.stopPropagation();improveCv(${i})" id="improveBtn${i}">✨ Bu İlana Göre CV Skill Düzenle</button></div></div>`;
  });
  h+=`<button class="btn btn-outline" onclick="location.reload()" style="margin-top:12px">Yeni Analiz Yap</button>`;
  $('step2').innerHTML=h;window._results=results;
}

function toggleCard(i){$('detail'+i).classList.toggle('hidden');$('card'+i).classList.toggle('open')}

// ===== CV IMPROVE =====
async function improveCv(i){
  const r=window._results[i];const btn=$('improveBtn'+i);
  btn.disabled=true;btn.textContent='⏳ Skill listesi düzenleniyor...';
  const prompt=`Adayın CV'sindeki SADECE SKILLS (yetenekler) bölümünü aşağıdaki iş ilanına göre düzenle.

KURALLAR:
- CV'nin SADECE SKILLS bölümünü değiştir.
- Diğer bölümlere (isim, iletişim, summary, experience, education, language) DOKUNMA. Aynen kopyala.
- Skills bölümünde:
  1. İlanla eşleşen skill'leri EN BAŞA koy
  2. Adayın mevcut skill'lerini ilana uygun anahtar kelimelerle yeniden adlandır (örn: "Backend Development" → "Backend Development (Python, Dart)")
  3. İlanda istenen ama CV'de olmayan skill'leri EKLEME — sadece mevcut olanları düzenle
- CV'nin orijinal formatını ve yapısını koru.

İŞ İLANI: ${r._title} @ ${r._company}
${(r._desc||r.summary||'').slice(0,2000)}

İLANLA EŞLEŞEN SKİLL'LER: ${(r.matching_skills||[]).join(', ')}
İLANDA İSTENEN EKSİK SKİLL'LER: ${(r.missing_skills||[]).join(', ')}

ADAYIN MEVCUT CV'Sİ:
${cvText.slice(0,2500)}

Şimdi CV'yi aynen yaz, SADECE SKILLS bölümünü ilana uygun düzenle. Başka hiçbir yeri değiştirme.`;

  try{
    const improved=await callGroq(prompt,false);
    $('modalSub').textContent=r._title+' @ '+r._company;
    $('cvOutput').textContent=improved;
    $('cvModal').classList.remove('hidden');
    $('btnCopyCv').onclick=()=>{navigator.clipboard.writeText(improved);$('btnCopyCv').textContent='✓ Kopyalandı!';setTimeout(()=>$('btnCopyCv').textContent='📋 CV\'yi Kopyala',2000)};
  }catch(e){alert('Hata: '+(e.message||JSON.stringify(e)))}
  finally{btn.disabled=false;btn.textContent='✨ Skill Listesini Düzenle'}
}
</script>
